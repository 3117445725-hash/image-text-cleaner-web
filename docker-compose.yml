services:
  web:
    build: .
    ports:
      - "${WEB_PORT:-10000}:10000"
    environment:
      APP_TITLE: ${APP_TITLE:-图片敏感词链接检测平台}
      APP_PASSWORD: ${APP_PASSWORD:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      MAX_URLS_PER_JOB: ${MAX_URLS_PER_JOB:-5000}
      MAX_IMAGE_MB: ${MAX_IMAGE_MB:-15}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-1}
      JOB_TTL_HOURS: ${JOB_TTL_HOURS:-24}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
