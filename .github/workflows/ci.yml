name: CI

on:
  push:
    branches: [main, optimize-production-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app

      - name: Import application
        env:
          APP_PASSWORD: ci-test-password
          DATA_DIR: /tmp/image-text-cleaner-ci
        run: python -c "from app.main import app; assert app.title"

      - name: Verify Docker Compose config
        run: docker compose config -q
