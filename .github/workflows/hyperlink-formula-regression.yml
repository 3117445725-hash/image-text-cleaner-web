name: Hyperlink formula extraction regression

on:
  pull_request:
    paths:
      - 'app/services/excel.py'
      - 'tests/test_hyperlink_formula_variants.py'
      - '.github/workflows/hyperlink-formula-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hyperlink-formulas:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install isolated test dependency
        run: python -m pip install 'openpyxl>=3.1.5,<4'
      - name: Compile Excel module
        run: python -m py_compile app/services/excel.py
      - name: Run hyperlink formula regression
        run: python -m unittest discover -s tests -p 'test_hyperlink_formula_variants.py' -v
